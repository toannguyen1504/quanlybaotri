global
  log stdout format raw local0

defaults
  log global
  mode http
  option httplog
  option dontlognull
  timeout connect 3s
  timeout client 30s
  timeout server 30s

resolvers docker
  nameserver dns 127.0.0.11:53
  resolve_retries 3
  timeout resolve 1s
  timeout retry 1s
  hold valid 10s

frontend organization_service
  bind :8086
  acl health_path path -i /ha-health
  http-request return status 200 content-type text/plain string "UP\n" if health_path { nbsrv(organization_backends) gt 0 }
  http-request return status 503 content-type text/plain string "DOWN\n" if health_path
  default_backend organization_backends

backend organization_backends
  balance roundrobin
  option httpchk
  http-check connect port 9000
  http-check send meth GET uri /actuator/health/readiness ver HTTP/1.1 hdr Host localhost
  http-check expect status 200
  server app-a organization-app-a:8086 check port 9000 inter 2s fall 3 rise 2 resolvers docker resolve-prefer ipv4 init-addr last,libc,none
  server app-b organization-app-b:8086 check port 9000 inter 2s fall 3 rise 2 resolvers docker resolve-prefer ipv4 init-addr last,libc,none

listen stats
  bind :8404
  stats enable
  stats uri /stats
  stats refresh 5s
