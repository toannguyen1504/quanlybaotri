name: maintenance-platform

x-java-healthcheck: &java-healthcheck
  interval: 10s
  timeout: 5s
  retries: 18
  start_period: 30s

x-service-environment: &service-environment
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: 5672
  RABBITMQ_USERNAME: ${RABBITMQ_USER}
  RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
  REDIS_HOST: redis
  REDIS_PORT: 6379
  JWK_SET_URI: http://identity-service:8081/.well-known/jwks.json

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPER_PASSWORD}
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD}
      ORGANIZATION_DB_PASSWORD: ${ORGANIZATION_DB_PASSWORD}
      ASSET_DB_PASSWORD: ${ASSET_DB_PASSWORD}
      MAINTENANCE_DB_PASSWORD: ${MAINTENANCE_DB_PASSWORD}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD:-change-payment-db-password}
      INVENTORY_DB_PASSWORD: ${INVENTORY_DB_PASSWORD}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./infra/postgres/migration:/migration:ro
    networks: [edge, backend]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d postgres']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management-alpine
    command: rabbitmq-server
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - '15672:15672'
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - ./infra/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    networks: [backend]
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  rabbitmq-init:
    image: rabbitmq:4-management-alpine
    entrypoint: ['/bin/sh', '-ec']
    command:
      - >-
        attempt=1;
        until rabbitmqadmin --host rabbitmq --port 15672
        --username "$${RABBITMQ_USER}" --password "$${RABBITMQ_PASSWORD}"
        definitions import --file /config/definitions.json --non-interactive;
        do
          if [ "$${attempt}" -ge 30 ]; then
            echo "RabbitMQ definitions import failed after $${attempt} attempts" >&2;
            exit 1;
          fi;
          attempt=$$((attempt + 1));
          sleep 2;
        done
    environment:
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
    volumes:
      - ./infra/rabbitmq/definitions.json:/config/definitions.json:ro
    networks: [backend]
    depends_on:
      rabbitmq: { condition: service_healthy }
    restart: 'no'

  redis:
    image: redis:8-alpine
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis-data:/data
    networks: [backend]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-minio-root-password}
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - minio-data:/data
    networks: [edge, backend]
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    entrypoint: ['/bin/sh', '-ec']
    command:
      - >-
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}";
        mc mb --ignore-existing local/maintenance-attachments;
        mc mb --ignore-existing local/asset-documents;
        mc anonymous set none local/maintenance-attachments;
        mc anonymous set none local/asset-documents;
        mc admin user add local "$${MAINTENANCE_ACCESS_KEY}" "$${MAINTENANCE_SECRET_KEY}" || true;
        mc admin user add local "$${ASSET_ACCESS_KEY}" "$${ASSET_SECRET_KEY}" || true;
        mc admin policy create local maintenance-storage /policies/maintenance-policy.json || true;
        mc admin policy create local asset-storage /policies/asset-policy.json || true;
        mc admin policy attach local maintenance-storage --user "$${MAINTENANCE_ACCESS_KEY}";
        mc admin policy attach local asset-storage --user "$${ASSET_ACCESS_KEY}";
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-minio-root-password}
      MAINTENANCE_ACCESS_KEY: ${MAINTENANCE_S3_ACCESS_KEY:-maintenance-service}
      MAINTENANCE_SECRET_KEY: ${MAINTENANCE_S3_SECRET_KEY:-change-maintenance-s3-secret}
      ASSET_ACCESS_KEY: ${ASSET_S3_ACCESS_KEY:-asset-service}
      ASSET_SECRET_KEY: ${ASSET_S3_SECRET_KEY:-change-asset-s3-secret}
    volumes:
      - ./infra/minio:/policies:ro
    networks: [backend]
    depends_on:
      minio: { condition: service_healthy }
    restart: 'no'

  identity-service:
    build:
      context: .
      dockerfile: services/identity-service/Dockerfile
    environment:
      <<: *service-environment
      DB_URL: jdbc:postgresql://postgres:5432/identity_db
      DB_USERNAME: identity_app
      DB_PASSWORD: ${IDENTITY_DB_PASSWORD}
      JWT_KEY_DIRECTORY: /data/keys
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      CUSTOMER_SCOPE_MIGRATION_ENABLED: ${CUSTOMER_SCOPE_MIGRATION_ENABLED:-false}
      ORGANIZATION_SERVICE_URL: http://organization-service:8086
      IDENTITY_SERVICE_CLIENT_SECRET: ${IDENTITY_SERVICE_CLIENT_SECRET}
      ASSET_SERVICE_CLIENT_SECRET: ${ASSET_SERVICE_CLIENT_SECRET}
      MAINTENANCE_SERVICE_CLIENT_SECRET: ${MAINTENANCE_SERVICE_CLIENT_SECRET}
      PAYMENT_SERVICE_CLIENT_SECRET: ${PAYMENT_SERVICE_CLIENT_SECRET:-change-payment-service-client-secret}
      INVENTORY_SERVICE_CLIENT_SECRET: ${INVENTORY_SERVICE_CLIENT_SECRET}
      NOTIFICATION_SERVICE_CLIENT_SECRET: ${NOTIFICATION_SERVICE_CLIENT_SECRET}
    volumes:
      - identity-keys:/data/keys
    tmpfs: [/tmp]
    read_only: true
    networks: [backend, google-egress]
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq-init: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      <<: *java-healthcheck
      test:
        [
          'CMD-SHELL',
          'wget -qO- http://127.0.0.1:9000/actuator/health/readiness >/dev/null || exit 1',
        ]
    restart: unless-stopped

  organization-service:
    build:
      context: .
      dockerfile: services/organization-service/Dockerfile
    environment:
      <<: *service-environment
      DB_URL: jdbc:postgresql://postgres:5432/organization_db
      DB_USERNAME: organization_app
      DB_PASSWORD: ${ORGANIZATION_DB_PASSWORD}
    tmpfs: [/tmp]
    read_only: true
    networks: [backend]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      identity-service: { condition: service_healthy }
    healthcheck:
      <<: *java-healthcheck
      test:
        [
          'CMD-SHELL',
          'wget -qO- http://127.0.0.1:9000/actuator/health/readiness >/dev/null || exit 1',
        ]
    restart: unless-stopped

  asset-service:
    build:
      context: .
      dockerfile: services/asset-service/Dockerfile
    environment:
      <<: *service-environment
      DB_URL: jdbc:postgresql://postgres:5432/asset_db
      DB_USERNAME: asset_app
      DB_PASSWORD: ${ASSET_DB_PASSWORD}
      ORGANIZATION_SERVICE_URL: http://organization-service:8086
      ASSET_SERVICE_CLIENT_SECRET: ${ASSET_SERVICE_CLIENT_SECRET}
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      S3_REGION: us-east-1
      S3_PATH_STYLE: 'true'
      S3_BUCKET: asset-documents
      S3_ACCESS_KEY: ${ASSET_S3_ACCESS_KEY:-asset-service}
      S3_SECRET_KEY: ${ASSET_S3_SECRET_KEY:-change-asset-s3-secret}
    tmpfs: [/tmp]
    read_only: true
    networks: [backend]
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      identity-service: { condition: service_healthy }
      organization-service: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    healthcheck:
      <<: *java-healthcheck
      test:
        [
          'CMD-SHELL',
          'wget -qO- http://127.0.0.1:9000/actuator/health/readiness >/dev/null || exit 1',
        ]
    restart: unless-stopped

  maintenance-service:
    build:
      context: .
      dockerfile: services/maintenance-service/Dockerfile
    environment:
      <<: *service-environment
      DB_URL: jdbc:postgresql://postgres:5432/maintenance_db
      DB_USERNAME: maintenance_app
      DB_PASSWORD: ${MAINTENANCE_DB_PASSWORD}
      IDENTITY_URL: http://identity-service:8081
      ASSET_URL: http://asset-service:8082
      INVENTORY_SERVICE_URL: http://inventory-service:8084
      ORGANIZATION_URL: http://organization-service:8086
      PAYMENT_SERVICE_URL: http://payment-service:8087
      STATISTICS_REPORT_CACHE_TTL: ${STATISTICS_REPORT_CACHE_TTL:-1m}
      MAINTENANCE_SERVICE_CLIENT_SECRET: ${MAINTENANCE_SERVICE_CLIENT_SECRET}
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      S3_REGION: us-east-1
      S3_PATH_STYLE: 'true'
      S3_BUCKET: maintenance-attachments
      S3_ACCESS_KEY: ${MAINTENANCE_S3_ACCESS_KEY:-maintenance-service}
      S3_SECRET_KEY: ${MAINTENANCE_S3_SECRET_KEY:-change-maintenance-s3-secret}
    volumes:
      - attachments:/legacy-uploads:ro
    tmpfs: [/tmp]
    read_only: true
    networks: [backend]
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      redis: { condition: service_healthy }
      identity-service: { condition: service_healthy }
      asset-service: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    healthcheck:
      <<: *java-healthcheck
      test:
        [
          'CMD-SHELL',
          'wget -qO- http://127.0.0.1:9000/actuator/health/readiness >/dev/null || exit 1',
        ]
    restart: unless-stopped

  payment-service:
    build:
      context: .
      dockerfile: services/payment-service/Dockerfile
    environment:
      <<: *service-environment
      DB_URL: jdbc:postgresql://postgres:5432/payment_db
      DB_USERNAME: payment_app
      DB_PASSWORD: ${PAYMENT_DB_PASSWORD:-change-payment-db-password}
      IDENTITY_URL: http://identity-service:8081
      MAINTENANCE_SERVICE_URL: http://maintenance-service:8083
      ORGANIZATION_SERVICE_URL: http://organization-service:8086
      PAYMENT_SERVICE_CLIENT_SECRET: ${PAYMENT_SERVICE_CLIENT_SECRET:-change-payment-service-client-secret}
      VNPAY_TMN_CODE: ${VNPAY_TMN_CODE:-}
      VNPAY_HASH_SECRET: ${VNPAY_HASH_SECRET:-}
      VNPAY_PAYMENT_URL: ${VNPAY_PAYMENT_URL:-https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
      VNPAY_QUERY_URL: ${VNPAY_QUERY_URL:-https://sandbox.vnpayment.vn/merchant_webapi/api/transaction}
      VNPAY_RETURN_URL: ${VNPAY_RETURN_URL:-http://localhost:8080/api/v1/payments/vnpay/return}
      VNPAY_IPN_URL: ${VNPAY_IPN_URL:-http://localhost:8080/api/v1/payments/vnpay/ipn}
      VNPAY_FRONTEND_RESULT_URL: ${VNPAY_FRONTEND_RESULT_URL:-http://localhost:4200/payment-result}
      VNPAY_PAYMENT_EXPIRY: ${VNPAY_PAYMENT_EXPIRY:-15m}
    tmpfs: [/tmp]
    read_only: true
    networks: [backend, vnpay-egress]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      identity-service: { condition: service_healthy }
      organization-service: { condition: service_healthy }
      maintenance-service: { condition: service_healthy }
    healthcheck:
      <<: *java-healthcheck
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:9000/actuator/health/readiness >/dev/null || exit 1']
    restart: unless-stopped

  inventory-service:
    build:
      context: .
      dockerfile: services/inventory-service/Dockerfile
    environment:
      <<: *service-environment
      DB_URL: jdbc:postgresql://postgres:5432/inventory_db
      DB_USERNAME: inventory_app
      DB_PASSWORD: ${INVENTORY_DB_PASSWORD}
      MAINTENANCE_SERVICE_URL: http://maintenance-service:8083
      IDENTITY_URL: http://identity-service:8081
      INVENTORY_SERVICE_CLIENT_SECRET: ${INVENTORY_SERVICE_CLIENT_SECRET}
    tmpfs: [/tmp]
    read_only: true
    networks: [backend]
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      identity-service: { condition: service_healthy }
      maintenance-service: { condition: service_healthy }
    healthcheck:
      <<: *java-healthcheck
      test:
        [
          'CMD-SHELL',
          'wget -qO- http://127.0.0.1:9000/actuator/health/readiness >/dev/null || exit 1',
        ]
    restart: unless-stopped

  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    environment:
      <<: *service-environment
      DB_URL: jdbc:postgresql://postgres:5432/notification_db
      DB_USERNAME: notification_app
      DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
      IDENTITY_SERVICE_URL: http://identity-service:8081
      MAINTENANCE_SERVICE_URL: http://maintenance-service:8083
      INVENTORY_SERVICE_URL: http://inventory-service:8084
      NOTIFICATION_SERVICE_CLIENT_SECRET: ${NOTIFICATION_SERVICE_CLIENT_SECRET}
      TELEGRAM_ENABLED: ${TELEGRAM_ENABLED:-false}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-technician001_bot}
      TELEGRAM_APP_PUBLIC_URL: ${TELEGRAM_APP_PUBLIC_URL:-http://localhost:4200}
      TELEGRAM_CONVERSATION_TTL: ${TELEGRAM_CONVERSATION_TTL:-2h}
      RABBITMQ_STOMP_PORT: 61613
      CHAT_ALLOWED_ORIGIN_PATTERNS: ${CHAT_ALLOWED_ORIGIN_PATTERNS:-http://localhost:*}
    tmpfs: [/tmp]
    read_only: true
    networks: [backend, telegram-egress]
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      redis: { condition: service_healthy }
      identity-service: { condition: service_healthy }
      maintenance-service: { condition: service_healthy }
      inventory-service: { condition: service_healthy }
    healthcheck:
      <<: *java-healthcheck
      test:
        [
          'CMD-SHELL',
          'wget -qO- http://127.0.0.1:9000/actuator/health/readiness >/dev/null || exit 1',
        ]
    restart: unless-stopped

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    environment:
      <<: *service-environment
      IDENTITY_SERVICE_URL: http://identity-service:8081
      ASSET_SERVICE_URL: http://asset-service:8082
      MAINTENANCE_SERVICE_URL: http://maintenance-service:8083
      PAYMENT_SERVICE_URL: http://payment-service:8087
      INVENTORY_SERVICE_URL: http://inventory-service:8084
      ORGANIZATION_SERVICE_URL: http://organization-service:8086
      NOTIFICATION_SERVICE_URL: http://notification-service:8085
    ports:
      - '8080:8080'
    tmpfs: [/tmp]
    read_only: true
    networks: [edge, backend]
    depends_on:
      identity-service: { condition: service_healthy }
      organization-service: { condition: service_healthy }
      asset-service: { condition: service_healthy }
      maintenance-service: { condition: service_healthy }
      payment-service: { condition: service_healthy }
      inventory-service: { condition: service_healthy }
      notification-service: { condition: service_healthy }
    healthcheck:
      <<: *java-healthcheck
      test:
        [
          'CMD-SHELL',
          'wget -qO- http://127.0.0.1:9000/actuator/health/readiness >/dev/null || exit 1',
        ]
    restart: unless-stopped

  web:
    build:
      context: ./angular/first-angular-app
      dockerfile: Dockerfile
    ports:
      - '4200:80'
    networks: [edge, backend]
    depends_on:
      api-gateway: { condition: service_healthy }
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [observability]
    command: ['--config.file=/etc/prometheus/prometheus.yml', '--storage.tsdb.path=/prometheus']
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - '9090:9090'
    networks: [edge, backend]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.1
    profiles: [observability]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - '3000:3000'
    networks: [edge, backend]
    depends_on: [prometheus]
    restart: unless-stopped

networks:
  edge:
  backend:
    internal: true
  telegram-egress:
  google-egress:
  vnpay-egress:

volumes:
  postgres-data:
  rabbitmq-data:
  redis-data:
  minio-data:
  attachments:
  identity-keys:
  prometheus-data:
  grafana-data:
