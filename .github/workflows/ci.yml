name: CI and container delivery

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  detect-components:
    runs-on: ubuntu-latest
    outputs:
      base: ${{ steps.detect.outputs.base }}
      head: ${{ steps.detect.outputs.head }}
      previous_tag: ${{ steps.detect.outputs.previous_tag }}
      changed: ${{ steps.detect.outputs.changed }}
      unchanged: ${{ steps.detect.outputs.unchanged }}
      has_changed: ${{ steps.detect.outputs.has_changed }}
      has_unchanged: ${{ steps.detect.outputs.has_unchanged }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect affected container components
        id: detect
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          base=""
          previous_tag=""
          force_all=false

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
          elif [[ "$REF_TYPE" == "tag" ]]; then
            previous_tag="$(git describe --tags --match 'v*' --abbrev=0 "$HEAD_SHA^" 2>/dev/null || true)"
            base="$previous_tag"
          else
            base="$BEFORE_SHA"
          fi

          if [[ -z "$base" || "$base" =~ ^0+$ ]] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            force_all=true
            base=""
          fi

          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "head=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "previous_tag=$previous_tag" >> "$GITHUB_OUTPUT"

          if [[ "$force_all" == "true" ]]; then
            node .github/scripts/ci-components.mjs --all >> "$GITHUB_OUTPUT"
          else
            git diff --name-only "$base" "$HEAD_SHA" -- > "$RUNNER_TEMP/changed-files.txt"
            node .github/scripts/ci-components.mjs \
              --paths-file "$RUNNER_TEMP/changed-files.txt" >> "$GITHUB_OUTPUT"
          fi

  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/cache@v6
        with:
          path: .m2-repository
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-

      - name: Run backend tests
        run: bash ./mvnw -s ./.mvn/settings-local.xml test

  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: angular/first-angular-app
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: angular/first-angular-app/package-lock.json

      - run: npm ci
      - run: npm test -- --watch=false
      - run: npm run build

  configuration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Reject packaged credential defaults
        run: node .github/scripts/check-sensitive-defaults.mjs

      - name: Validate Docker Compose model
        run: docker compose --env-file .env.example config --quiet

  secret-scan:
    needs: detect-components
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan changed Git history for verified secrets
        uses: trufflesecurity/trufflehog@v3.99.8
        with:
          path: ./
          base: ${{ needs.detect-components.outputs.base }}
          head: ${{ needs.detect-components.outputs.head }}
          version: 3.99.8
          extra_args: --only-verified

  build-images:
    needs:
      - detect-components
      - backend-test
      - frontend-test
      - configuration
      - secret-scan
    if: needs.detect-components.outputs.has_changed == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect-components.outputs.changed) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4

      - name: Build ${{ matrix.name }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          tags: local/quanlybaotri-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Create HIGH and CRITICAL report
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: local/quanlybaotri-${{ matrix.name }}:${{ github.sha }}
          format: sarif
          output: trivy-${{ matrix.name }}.sarif
          severity: HIGH,CRITICAL
          exit-code: "0"

      - name: Upload vulnerability report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-${{ matrix.name }}-${{ github.run_id }}
          path: trivy-${{ matrix.name }}.sarif
          if-no-files-found: warn
          retention-days: 30

      - name: Block CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: local/quanlybaotri-${{ matrix.name }}:${{ github.sha }}
          format: table
          severity: CRITICAL
          exit-code: "0"

      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish changed image
        if: github.event_name == 'push'
        shell: bash
        env:
          COMPONENT: ${{ matrix.name }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          HEAD_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          if [[ -z "$DOCKERHUB_USERNAME" ]]; then
            echo "::error::DOCKERHUB_USERNAME is not configured"
            exit 1
          fi

          local_image="local/quanlybaotri-$COMPONENT:$HEAD_SHA"
          repository="$DOCKERHUB_USERNAME/quanlybaotri-$COMPONENT"
          tags=("sha-$HEAD_SHA" "latest")
          if [[ "$REF_TYPE" == "tag" ]]; then
            tags+=("$REF_NAME")
          fi

          for tag in "${tags[@]}"; do
            docker tag "$local_image" "$repository:$tag"
            docker push "$repository:$tag"
          done

  retag-unchanged-images:
    needs:
      - detect-components
      - backend-test
      - frontend-test
      - configuration
      - secret-scan
      - build-images
    if: >-
      always() &&
      startsWith(github.ref, 'refs/tags/v') &&
      needs.detect-components.outputs.has_unchanged == 'true' &&
      needs.backend-test.result == 'success' &&
      needs.frontend-test.result == 'success' &&
      needs.configuration.result == 'success' &&
      needs.secret-scan.result == 'success' &&
      (needs.build-images.result == 'success' || needs.build-images.result == 'skipped')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect-components.outputs.unchanged) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Locate previous release image
        id: source
        shell: bash
        env:
          COMPONENT: ${{ matrix.name }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          PREVIOUS_TAG: ${{ needs.detect-components.outputs.previous_tag }}
        run: |
          set -euo pipefail
          repository="$DOCKERHUB_USERNAME/quanlybaotri-$COMPONENT"
          source_image="$repository:$PREVIOUS_TAG"
          echo "source_image=$source_image" >> "$GITHUB_OUTPUT"
          if [[ -n "$PREVIOUS_TAG" ]] && docker buildx imagetools inspect "$source_image" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build fallback when previous image is missing
        if: steps.source.outputs.exists != 'true'
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          load: true
          push: false
          provenance: false
          tags: local/quanlybaotri-${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Select image to scan
        id: scan-target
        shell: bash
        env:
          SOURCE_EXISTS: ${{ steps.source.outputs.exists }}
          SOURCE_IMAGE: ${{ steps.source.outputs.source_image }}
          COMPONENT: ${{ matrix.name }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ "$SOURCE_EXISTS" == "true" ]]; then
            echo "image=$SOURCE_IMAGE" >> "$GITHUB_OUTPUT"
          else
            echo "image=local/quanlybaotri-$COMPONENT:$HEAD_SHA" >> "$GITHUB_OUTPUT"
          fi

      - name: Create HIGH and CRITICAL report
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.scan-target.outputs.image }}
          format: sarif
          output: trivy-${{ matrix.name }}.sarif
          severity: HIGH,CRITICAL
          exit-code: "0"

      - name: Upload vulnerability report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: trivy-release-${{ matrix.name }}-${{ github.run_id }}
          path: trivy-${{ matrix.name }}.sarif
          if-no-files-found: warn
          retention-days: 30

      - name: Block CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.scan-target.outputs.image }}
          format: table
          severity: CRITICAL
          exit-code: "0"

      - name: Retag previous digest or publish fallback
        shell: bash
        env:
          COMPONENT: ${{ matrix.name }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          HEAD_SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          SOURCE_EXISTS: ${{ steps.source.outputs.exists }}
          SOURCE_IMAGE: ${{ steps.source.outputs.source_image }}
        run: |
          set -euo pipefail
          repository="$DOCKERHUB_USERNAME/quanlybaotri-$COMPONENT"
          if [[ "$SOURCE_EXISTS" == "true" ]]; then
            docker buildx imagetools create \
              --tag "$repository:$REF_NAME" \
              "$SOURCE_IMAGE"
          else
            local_image="local/quanlybaotri-$COMPONENT:$HEAD_SHA"
            for tag in "$REF_NAME" "latest" "sha-$HEAD_SHA"; do
              docker tag "$local_image" "$repository:$tag"
              docker push "$repository:$tag"
            done
          fi

  verify-release:
    needs:
      - detect-components
      - backend-test
      - frontend-test
      - configuration
      - secret-scan
      - build-images
      - retag-unchanged-images
    if: >-
      always() &&
      startsWith(github.ref, 'refs/tags/v') &&
      needs.backend-test.result == 'success' &&
      needs.frontend-test.result == 'success' &&
      needs.configuration.result == 'success' &&
      needs.secret-scan.result == 'success' &&
      (needs.build-images.result == 'success' || needs.build-images.result == 'skipped') &&
      (needs.retag-unchanged-images.result == 'success' || needs.retag-unchanged-images.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Verify all release images
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          components=(
            api-gateway identity-service organization-service asset-service
            maintenance-service payment-service inventory-service
            notification-service ai-service web
          )
          for component in "${components[@]}"; do
            docker buildx imagetools inspect \
              "$DOCKERHUB_USERNAME/quanlybaotri-$component:$RELEASE_TAG" >/dev/null
          done
