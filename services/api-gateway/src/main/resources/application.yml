spring:
  application:
    name: api-gateway
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${JWK_SET_URI:http://identity-service:8081/.well-known/jwks.json}
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: identity
              uri: ${IDENTITY_SERVICE_URL:http://identity-service:8081}
              predicates:
                - Path=/api/v1/auth/**,/api/v1/users/**,/api/v1/roles/**
            - id: organization
              uri: ${ORGANIZATION_SERVICE_URL:http://organization-service:8086}
              predicates:
                - Path=/api/v1/departments/**
            - id: asset
              uri: ${ASSET_SERVICE_URL:http://asset-service:8082}
              predicates:
                - Path=/api/v1/equipment/**,/api/v1/equipment-categories/**
            - id: inventory-ticket-parts
              uri: ${INVENTORY_SERVICE_URL:http://inventory-service:8084}
              predicates:
                - Path=/api/v1/tickets/*/parts
            - id: inventory
              uri: ${INVENTORY_SERVICE_URL:http://inventory-service:8084}
              predicates:
                - Path=/api/v1/parts/**,/api/v1/stock-movements/**
            - id: notification
              uri: ${NOTIFICATION_SERVICE_URL:http://notification-service:8085}
              predicates:
                - Path=/api/v1/notifications/**
            - id: maintenance
              uri: ${MAINTENANCE_SERVICE_URL:http://maintenance-service:8083}
              predicates:
                - Path=/api/v1/tickets/**,/api/v1/sla-policies/**,/api/v1/attachments/**,/api/v1/reports/**

server:
  port: 8080
  forward-headers-strategy: framework

management:
  server:
    port: 9000
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  structured:
    format:
      console: logstash
