spring:
  application.name: notification-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres:5432/notification_db}
    username: ${DB_USERNAME:notification_app}
    password: ${DB_PASSWORD:notification_dev}
  jpa:
    hibernate.ddl-auto: validate
    open-in-view: false
  flyway.enabled: true
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:maintenance_app}
    password: ${RABBITMQ_PASSWORD:maintenance_dev}
    publisher-confirm-type: correlated
    publisher-returns: true
    listener.simple:
      default-requeue-rejected: false
      retry:
        enabled: true
        max-attempts: 5
        initial-interval: 1s
        multiplier: 2
        max-interval: 10s
  data.redis:
    host: ${REDIS_HOST:redis}
    port: ${REDIS_PORT:6379}
  security.oauth2.resourceserver.jwt.jwk-set-uri: ${JWK_SET_URI:http://identity-service:8081/.well-known/jwks.json}
server.port: 8085
app:
  identity-url: ${IDENTITY_SERVICE_URL:http://identity-service:8081}
  maintenance-url: ${MAINTENANCE_SERVICE_URL:http://maintenance-service:8083}
  inventory-url: ${INVENTORY_SERVICE_URL:http://inventory-service:8084}
  service-client.secret: ${NOTIFICATION_SERVICE_CLIENT_SECRET:change-notification-service-client-secret}
  telegram:
    enabled: ${TELEGRAM_ENABLED:false}
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    bot-username: ${TELEGRAM_BOT_USERNAME:technician001_bot}
    app-public-url: ${TELEGRAM_APP_PUBLIC_URL:http://localhost:4200}
    link-ttl: 10m
    conversation-ttl: ${TELEGRAM_CONVERSATION_TTL:2h}
    poll-timeout-seconds: 25
  chat:
    stomp-port: ${RABBITMQ_STOMP_PORT:61613}
    allowed-origin-patterns: ${CHAT_ALLOWED_ORIGIN_PATTERNS:http://localhost:*}
management:
  server.port: 9000
  endpoints.web.exposure.include: health,info,prometheus
  endpoint.health.probes.enabled: true
logging.structured.format.console: logstash
