spring:
  application.name: organization-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres:5432/organization_db}
    username: ${DB_USERNAME:organization_app}
    password: ${DB_PASSWORD:organization_dev}
  jpa:
    hibernate.ddl-auto: validate
    open-in-view: false
  flyway.enabled: true
  data.redis:
    host: ${REDIS_HOST:redis}
    port: ${REDIS_PORT:6379}
  security.oauth2.resourceserver.jwt.jwk-set-uri: ${JWK_SET_URI:http://identity-service:8081/.well-known/jwks.json}
server.port: 8086
management:
  server.port: 9000
  endpoints.web.exposure.include: health,info,prometheus
  endpoint.health.probes.enabled: true
logging.structured.format.console: logstash
