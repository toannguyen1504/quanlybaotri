spring:
  application:
    name: identity-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres:5432/identity_db}
    username: ${DB_USERNAME:identity_app}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      timeout: ${REDIS_TIMEOUT:2s}

server:
  port: 8081
  forward-headers-strategy: framework

app:
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
  customer-scope-migration:
    enabled: ${CUSTOMER_SCOPE_MIGRATION_ENABLED:false}
  organization-url: ${ORGANIZATION_SERVICE_URL:http://organization-service:8086}
  service-clients:
    identity-secret: ${IDENTITY_SERVICE_CLIENT_SECRET}
    asset-secret: ${ASSET_SERVICE_CLIENT_SECRET}
    maintenance-secret: ${MAINTENANCE_SERVICE_CLIENT_SECRET}
    payment-secret: ${PAYMENT_SERVICE_CLIENT_SECRET}
    inventory-secret: ${INVENTORY_SERVICE_CLIENT_SECRET}
    notification-secret: ${NOTIFICATION_SERVICE_CLIENT_SECRET}
  jwt:
    access-minutes: 15
    refresh-days: 7
    key-directory: ${JWT_KEY_DIRECTORY:/data/keys}
  bootstrap:
    admin:
      username: ${BOOTSTRAP_ADMIN_USERNAME:}
      password: ${BOOTSTRAP_ADMIN_PASSWORD:}
      email: ${BOOTSTRAP_ADMIN_EMAIL:admin@quanlybaotri.local}

management:
  server:
    port: 9000
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  structured:
    format:
      console: logstash
