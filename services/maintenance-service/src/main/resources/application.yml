spring:
  application.name: maintenance-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres:5432/maintenance_db}
    username: ${DB_USERNAME:maintenance_app}
    password: ${DB_PASSWORD:maintenance_dev}
  jpa:
    hibernate.ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    # V11__vnpay_payments.sql was intentionally moved to payment-service.
    # Existing maintenance databases retain that applied history entry.
    ignore-migration-patterns: 'versioned:missing'
  data.redis:
    host: ${REDIS_HOST:redis}
    port: ${REDIS_PORT:6379}
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:maintenance_app}
    password: ${RABBITMQ_PASSWORD:maintenance_dev}
    virtual-host: ${RABBITMQ_VIRTUAL_HOST:/}
    publisher-confirm-type: correlated
    publisher-returns: true
    listener.simple:
      default-requeue-rejected: false
      retry:
        enabled: true
        max-attempts: 5
        initial-interval: 1s
        multiplier: 2
        max-interval: 10s
  security.oauth2.resourceserver.jwt.jwk-set-uri: ${JWK_SET_URI:http://identity-service:8081/.well-known/jwks.json}
  servlet.multipart:
    max-file-size: 205MB
    max-request-size: 210MB
server.port: 8083
server.tomcat.max-http-form-post-size: 210MB
server.tomcat.max-swallow-size: 210MB
app:
  storage:
    endpoint: ${S3_ENDPOINT:}
    public-endpoint: ${S3_PUBLIC_ENDPOINT:${S3_ENDPOINT:}}
    region: ${S3_REGION:us-east-1}
    path-style: ${S3_PATH_STYLE:false}
    bucket: ${S3_BUCKET:maintenance-attachments}
    access-key: ${S3_ACCESS_KEY:}
    secret-key: ${S3_SECRET_KEY:}
    preview-minutes: ${S3_PREVIEW_MINUTES:2}
    cleanup-delay: ${S3_CLEANUP_DELAY:60000}
    migration:
      enabled: ${STORAGE_MIGRATION_ENABLED:false}
      dry-run: ${STORAGE_MIGRATION_DRY_RUN:true}
      legacy-root: ${STORAGE_MIGRATION_LEGACY_ROOT:/legacy-uploads}
  outbox.confirm-timeout: 5s
  identity-url: ${IDENTITY_URL:http://identity-service:8081}
  asset-url: ${ASSET_URL:http://asset-service:8082}
  inventory-url: ${INVENTORY_SERVICE_URL:http://inventory-service:8084}
  organization-url: ${ORGANIZATION_URL:http://organization-service:8086}
  payment-url: ${PAYMENT_SERVICE_URL:http://payment-service:8087}
  service-client.secret: ${MAINTENANCE_SERVICE_CLIENT_SECRET:maintenance-service-dev-secret}
  reporting.statistics-cache.ttl: ${STATISTICS_REPORT_CACHE_TTL:1m}
management:
  server.port: 9000
  endpoints.web.exposure.include: health,info,prometheus
  endpoint.health.probes.enabled: true
  endpoint.health.group.readiness.include: readinessState,s3ObjectStorage
logging.structured.format.console: logstash
