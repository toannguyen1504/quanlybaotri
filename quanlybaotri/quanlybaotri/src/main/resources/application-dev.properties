spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:123456}
app.jwt.secret=${JWT_SECRET:dev-only-secret-key-change-me-1234567890}
app.bootstrap.admin.username=${BOOTSTRAP_ADMIN_USERNAME:admin}
app.bootstrap.admin.password=${BOOTSTRAP_ADMIN_PASSWORD:Admin@123}
app.bootstrap.admin.email=${BOOTSTRAP_ADMIN_EMAIL:admin@quanlybaotri.local}

spring.rabbitmq.username=${RABBITMQ_USERNAME:maintenance_app}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:MaintenanceRabbit@123}
spring.rabbitmq.virtual-host=${RABBITMQ_VIRTUAL_HOST:quanlybaotri}

spring.jpa.show-sql=false
logging.level.com.example.quanlybaotri=DEBUG
management.health.redis.enabled=true
management.health.rabbit.enabled=${RABBITMQ_HEALTH_ENABLED:true}
